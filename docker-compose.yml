version: '3.9'
services:
  frontend:
    container_name: intania-888-frontend
    build:
      context: .
      args:
        - NEXT_PUBLIC_API_BASE_URL=https://api.888.chula.engineering/api/v1
        - NEXT_PUBLIC_AUTH_CLIENT_ID=intania-888-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://api.888.chula.engineering/api/v1
      NEXT_PUBLIC_AUTH_CLIENT_ID: intania-888-web
    ports:
      - 80:3000
