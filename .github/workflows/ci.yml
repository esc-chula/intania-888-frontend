name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build production image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # next build includes lint, TypeScript checks, and route generation.
      - name: Build with production browser settings
        env:
          NEXT_PUBLIC_API_BASE_URL: https://888-api.intania.org/api/v1
          NEXT_PUBLIC_AUTH_CLIENT_ID: intania-888-web
          NEXT_PUBLIC_INTANIA_GAMES_URL: ${{ vars.NEXT_PUBLIC_INTANIA_GAMES_URL || '' }}
        run: |
          docker build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL" \
            --build-arg NEXT_PUBLIC_AUTH_CLIENT_ID="$NEXT_PUBLIC_AUTH_CLIENT_ID" \
            --build-arg NEXT_PUBLIC_INTANIA_GAMES_URL="$NEXT_PUBLIC_INTANIA_GAMES_URL" \
            --tag "intania888-web-ci:$GITHUB_SHA" .
